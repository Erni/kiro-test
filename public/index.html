<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Portfolio</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Crypto Portfolio</h1>
  </header>

  <div id="connectivity-error-banner" class="connectivity-error-banner" hidden role="alert">
    The server could not be reached. Please check your connection.
  </div>

  <div id="loading-indicator" class="loading-indicator" hidden aria-live="polite">
    Loading&hellip;
  </div>

  <main>
    <section id="overview-section" aria-labelledby="overview-heading">
      <h2 id="overview-heading">Portfolio Overview</h2>
      <div id="overview-container"></div>
    </section>

    <section id="add-holding-section" aria-labelledby="add-holding-heading">
      <h2 id="add-holding-heading">Add Holding</h2>
      <div id="add-holding-container"></div>
    </section>

    <section id="transaction-section" aria-labelledby="transaction-heading">
      <h2 id="transaction-heading">Record Transaction</h2>
      <div id="transaction-container"></div>
    </section>

    <section id="transaction-history-section" aria-labelledby="transaction-history-heading">
      <h2 id="transaction-history-heading">Transaction History</h2>
      <div id="transaction-history-container"></div>
    </section>
  </main>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
